# CODECOV CONFIGURATION
# https://docs.codecov.com/docs/codecovyml-reference

---
codecov:
  notify:
    after_n_builds: 6
    wait_for_ci: true
  require_ci_to_pass: true

comment:
  after_n_builds: 6
  behavior: default
  layout: header,diff,flags,components,tree,footer
  require_base: false
  require_changes: false
  require_head: true
  show_carryforward_flags: true
  show_critical_paths: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: 100%
  individual_components:
    - component_id: docmark
      name: docmark
      paths:
        - packages/docmark/**/*.mts
    - component_id: docmark-factory-space
      name: docmark-factory-space
      paths:
        - packages/docmark-factory-space/**/*.mts
    - component_id: docmark-grammar
      name: docmark-grammar
      paths:
        - packages/docmark-grammar/**/*.mts
    - component_id: docmark-util-combine-extensions
      name: docmark-util-combine-extensions
      paths:
        - packages/docmark-util-combine-extensions/**/*.mts
    - component_id: docmark-util-subtokenize
      name: docmark-util-subtokenize
      paths:
        - packages/docmark-util-subtokenize/**/*.mts
    - component_id: docmark-util-symbol
      name: docmark-util-symbol
      paths:
        - packages/docmark-util-symbol/**/*.mts

coverage:
  precision: 2
  range: 90..100
  round: nearest
  status:
    changes:
      default:
        branches:
          - dependabot/*
          - feat/*
          - hotfix/*
          - main
          - release/*
        if_ci_failed: error
        if_not_found: success
        informational: false
        only_pulls: false
    patch:
      default:
        branches:
          - dependabot/*
          - feat/*
          - hotfix/*
          - main
          - release/*
        if_ci_failed: error
        if_not_found: success
        informational: false
        only_pulls: false
        target: 100%
        threshold: 0%
    project:
      default:
        branches:
          - dependabot/*
          - feat/*
          - hotfix/*
          - main
          - release/*
        if_ci_failed: error
        if_not_found: success
        informational: false
        only_pulls: false
        target: 100%
        threshold: 0%

flags:
  bun-canary:
    carryforward: false
  bun-latest:
    carryforward: false
  node26:
    carryforward: false
  node25:
    carryforward: false
  node24:
    carryforward: false
  node22:
    carryforward: false

github_checks:
  annotations: true

ignore:
  - '**/*.d.mts'
  - '**/__mocks__/**'
  - '**/__tests__/**'
  - '**/index.mts'
  - '**/interfaces/**'
  - '**/types/**'
  - '!packages/*/src/index.mts'
  - 'packages/docmark-util-types/**'

profiling:
  critical_files_paths:
    - packages/docmark/src/initialize/*.mts
    - packages/docmark-util-combine-extensions/src/index.mts
    - packages/docmark-util-subtokenize/src/subcontent.mts
